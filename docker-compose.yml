services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Barangay Inosluban}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      FACE_ENCRYPTION_KEY: ${FACE_ENCRYPTION_KEY:?Set FACE_ENCRYPTION_KEY in .env}
      FACE_ENROLLMENT_SETUP_TOKEN: ${FACE_ENROLLMENT_SETUP_TOKEN:?Set FACE_ENROLLMENT_SETUP_TOKEN in .env}
      FACE_ADMIN_RECOVERY_TOKEN: ${FACE_ADMIN_RECOVERY_TOKEN:?Set FACE_ADMIN_RECOVERY_TOKEN in .env}
      NATIONAL_ID_SERVICE_URL: http://127.0.0.1:8000
      NATIONAL_ID_SERVICE_TOKEN: ${NATIONAL_ID_SERVICE_TOKEN:-}
    depends_on:
      - db
      - tailscale
      - national-id
    network_mode: service:tailscale

  national-id:
    build:
      context: .
      dockerfile: national_id_service/Dockerfile
    restart: unless-stopped
    environment:
      NATIONAL_ID_SERVICE_TOKEN: ${NATIONAL_ID_SERVICE_TOKEN:-}
      NATIONAL_ID_MAX_IMAGE_BYTES: ${NATIONAL_ID_MAX_IMAGE_BYTES:-5000000}
      NATIONAL_ID_MAX_PIXELS: ${NATIONAL_ID_MAX_PIXELS:-12000000}
      NATIONAL_ID_FACE_THRESHOLD: ${NATIONAL_ID_FACE_THRESHOLD:-0.40}
    depends_on:
      - tailscale
    network_mode: service:tailscale

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-inosluban-local}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-inosluban-local}
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    command:
      - /bin/sh
      - -c
      - |
        tailscaled --state=$${TS_STATE_DIR}/tailscaled.state &
        until tailscale status >/dev/null 2>&1; do sleep 1; done
        tailscale up --authkey=$${TS_AUTHKEY} --hostname=$${TS_HOSTNAME:-inosluban-local} --accept-dns=false
        tailscale serve --bg 80
        wait

volumes:
  pgdata:
  tailscale-state: