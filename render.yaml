envVarGroups:
  - name: inosluban-national-id-auth
    envVars:
      - key: NATIONAL_ID_SERVICE_TOKEN
        generateValue: true

services:
  - type: pserv
    name: inosluban-national-id
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./national_id_service/Dockerfile
    dockerContext: ./national_id_service
    envVars:
      - fromGroup: inosluban-national-id-auth
      - key: PORT
        value: "8000"
      - key: NATIONAL_ID_REQUIRE_SERVICE_TOKEN
        value: "true"
      - key: NATIONAL_ID_MAX_IMAGE_BYTES
        value: "5000000"
      - key: NATIONAL_ID_MAX_PIXELS
        value: "12000000"
